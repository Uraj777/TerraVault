name: TerraVault CI pipeline

on:
  push:
    branches: [ main, deployment-ready ]
  pull_request:
    branches: [ main, deployment-ready ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run App Factory Sanity Check
      env:
        SECRET_KEY: ci_secret_key_placeholder
        DATABASE_URL: sqlite:///:memory:
        FLASK_ENV: testing
      run: |
        python -c "from app import create_app; app = create_app('testing'); print('Flask App Factory loaded successfully!')"
