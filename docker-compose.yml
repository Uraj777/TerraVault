version: '3.8'

services:
  web:
    build: .
    container_name: terravault
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///instance/terravault.db
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
