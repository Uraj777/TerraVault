<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer glow circle -->
  <defs>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="sphereGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#06b6d4" />
      <stop offset="50%" style="stop-color:#0891b2" />
      <stop offset="100%" style="stop-color:#164e63" />
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="50" cy="50" r="48" fill="url(#glowGradient)" />

  <!-- Main globe sphere -->
  <circle cx="50" cy="50" r="40" fill="url(#sphereGradient)" />

  <!-- Continents/landmass paths (simplified)-->
  <!-- North America -->
  <path d="M 35 35 L 40 32 L 42 35 L 40 40 Z" fill="#10b981" opacity="0.8" />
  
  <!-- South America -->
  <path d="M 38 48 L 42 46 L 43 55 L 39 54 Z" fill="#10b981" opacity="0.8" />
  
  <!-- Africa -->
  <path d="M 48 38 L 55 35 L 58 50 L 52 52 Z" fill="#10b981" opacity="0.8" />
  
  <!-- Europe -->
  <path d="M 50 28 L 55 30 L 54 35 L 51 33 Z" fill="#10b981" opacity="0.8" />
  
  <!-- Asia -->
  <path d="M 55 40 L 65 38 L 68 50 L 60 52 Z" fill="#10b981" opacity="0.8" />

  <!-- Latitude/Longitude grid lines (subtle) -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.3" />
  <circle cx="50" cy="50" r="35" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.2" />
  <line x1="50" y1="10" x2="50" y2="90" stroke="#06b6d4" stroke-width="0.5" opacity="0.2" />
  <line x1="10" y1="50" x2="90" y2="50" stroke="#06b6d4" stroke-width="0.5" opacity="0.2" />

  <!-- Highlight/shine effect -->
  <ellipse cx="38" cy="35" rx="12" ry="14" fill="white" opacity="0.15" />

  <!-- Outer border ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />
</svg>
