{% extends "base.html" %}

{% block title %}System Error (500){% endblock %}

{% block content %}
<div class="container my-5 text-center">
  <div class="py-5">
    <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-4"></i>
    <h1 class="display-4 fw-extrabold text-warning">500 - Vault Instability</h1>
    <p class="lead text-muted mb-4 mx-auto" style="max-width: 500px;">
      An unexpected disturbance has occurred within our system cores. We are logging the error and looking into it immediately.
    </p>
    <a href="{{ url_for('main.home') }}" class="btn btn-warning btn-lg px-4 text-white shadow-sm">
      <i class="fa-solid fa-house me-2"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
